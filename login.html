
{% extends "base.html" %}

{% block title %}Login | AVIA{% endblock %}

{% block content %}

<a class="voltar" href="{{ url_for('home') }}">← Voltar</a>

<div class="cartao centralizar">

    <div style="text-align:center;">
        <span class="icone">🔑</span>
        <h1>Bem-vindo!</h1>
        <p class="decoracao">{{ role_name }}</p>
        <p>Digite seu e-mail e sua senha para continuar.</p>
    </div>

    <form method="POST">

        <label>E-mail</label>
        <input type="email" name="email"
               placeholder="Digite seu e-mail" required>

        <label>Senha</label>
        <input type="password" name="password"
               placeholder="Digite sua senha" required>

        <button class="botao" style="width:100%;">
            Entrar →
        </button>

    </form>

    <div style="text-align:center; margin-top:20px;">
        <a href="{{ url_for('forgot_password') }}">
            Esqueci minha senha
        </a>
    </div>

    {% if role == 'cliente' %}
    <div style="text-align:center; margin-top:15px;">
        <a href="{{ url_for('register_client') }}">
            Criar uma conta
        </a>
    </div>
    {% endif %}

    <p class="decoracao" style="text-align:center; margin-top:20px;">
        Obrigado por escolher a AVIA!
    </p>

</div>

{% endblock %}
